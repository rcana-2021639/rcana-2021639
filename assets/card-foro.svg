<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-label="Proyecto: Foro Interuniversitario de Estudios de Posgrado">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f33"/>
      <stop offset="1" stop-color="#07030f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset=".5" stop-color="#ff5fe1"/>
      <stop offset="1" stop-color="#6366f1"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f3ff"/><stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="orb" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d946ef" stop-opacity=".5"/><stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect x="2" y="2" width="436" height="296" rx="18"/></clipPath>
    <style>
      text{font-family:'Segoe UI','Inter',Ubuntu,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
      .orb{animation:orb 9s ease-in-out infinite}
      @keyframes orb{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,40px)}}
      .node{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
      .n2{animation-delay:-.6s}.n3{animation-delay:-1.2s}.n4{animation-delay:-1.8s}
      .flow{stroke-dasharray:4 6;animation:flow 1.5s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-20}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect x="2" y="2" width="436" height="296" rx="18" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <circle class="orb" cx="380" cy="40" r="120" fill="url(#orb)"/>
    <!-- red de universidades -->
    <g transform="translate(330 70)" stroke="#c084fc" stroke-opacity=".6" fill="none">
      <path class="flow" d="M0 0 L40 -20 M0 0 L45 25 M0 0 L-10 40 M40 -20 L45 25 M45 25 L-10 40"/>
    </g>
    <g transform="translate(330 70)">
      <circle class="node" r="7" fill="#ff5fe1"/>
      <circle class="node n2" cx="40" cy="-20" r="5" fill="#a855f7"/>
      <circle class="node n3" cx="45" cy="25" r="5" fill="#22d3ee"/>
      <circle class="node n4" cx="-10" cy="40" r="5" fill="#c084fc"/>
    </g>
  </g>
  <rect x="2" y="2" width="436" height="296" rx="18" fill="none" stroke="url(#edge)" stroke-width="2"/>

  <text x="26" y="40" class="mono" font-size="11" fill="#e879f9" letter-spacing="2">★ DESTACADO · 2026</text>
  <text x="26" y="74" font-size="25" font-weight="800" fill="url(#title)">Foro de Posgrado</text>
  <text x="26" y="96" font-size="13" fill="#b9a9e0">Plataforma interuniversitaria · 9 universidades</text>

  <text font-size="13.5" fill="#ece8ff">
    <tspan x="26" y="128">API REST + panel admin con permisos por</tspan>
    <tspan x="26" y="147">universidad, seguridad OWASP, auditoría</tspan>
    <tspan x="26" y="166">y frontend animado con Next.js y Three.js.</tspan>
  </text>

  <!-- métricas -->
  <g font-size="11" fill="#b9a9e0">
    <text x="26" y="206" font-size="20" font-weight="800" fill="#f5f3ff">250+</text><text x="26" y="222">pruebas</text>
    <text x="118" y="206" font-size="20" font-weight="800" fill="#f5f3ff">12</text><text x="118" y="222">content-types</text>
    <text x="226" y="206" font-size="20" font-weight="800" fill="#f5f3ff">CI/CD</text><text x="226" y="222">GitHub Actions</text>
  </g>

  <g class="mono" font-size="11">
    <rect x="26" y="248" width="66" height="24" rx="12" fill="#a855f7" fill-opacity=".18" stroke="#a855f7" stroke-opacity=".5"/><text x="59" y="264" text-anchor="middle" fill="#e9d5ff">Strapi 5</text>
    <rect x="100" y="248" width="70" height="24" rx="12" fill="#a855f7" fill-opacity=".18" stroke="#a855f7" stroke-opacity=".5"/><text x="135" y="264" text-anchor="middle" fill="#e9d5ff">Next.js</text>
    <rect x="178" y="248" width="90" height="24" rx="12" fill="#a855f7" fill-opacity=".18" stroke="#a855f7" stroke-opacity=".5"/><text x="223" y="264" text-anchor="middle" fill="#e9d5ff">PostgreSQL</text>
    <rect x="276" y="248" width="60" height="24" rx="12" fill="#a855f7" fill-opacity=".18" stroke="#a855f7" stroke-opacity=".5"/><text x="306" y="264" text-anchor="middle" fill="#e9d5ff">Docker</text>
    <rect x="344" y="248" width="70" height="24" rx="12" fill="#a855f7" fill-opacity=".18" stroke="#a855f7" stroke-opacity=".5"/><text x="379" y="264" text-anchor="middle" fill="#e9d5ff">TypeScript</text>
  </g>
</svg>
