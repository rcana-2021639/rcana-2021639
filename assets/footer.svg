<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Gracias por visitar">
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#d946ef"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f3ff"/><stop offset=".5" stop-color="#f0abfc"/><stop offset="1" stop-color="#f5f3ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      text{font-family:'Segoe UI','Inter',Ubuntu,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
      .a{animation:wave 9s ease-in-out infinite}
      .b{animation:wave 13s ease-in-out infinite reverse}
      .c{animation:wave 7s ease-in-out infinite}
      @keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(-300px)}}
      .tw{animation:tw 2.6s ease-in-out infinite}.d1{animation-delay:-.8s}.d2{animation-delay:-1.6s}
      @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
    <clipPath id="clip"><rect width="1200" height="190" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <g fill="#f5f3ff">
      <circle class="tw" cx="120" cy="30" r="1.4"/><circle class="tw d1" cx="300" cy="60" r="1.1"/>
      <circle class="tw d2" cx="880" cy="25" r="1.5"/><circle class="tw" cx="1060" cy="70" r="1.2"/>
      <circle class="tw d1" cx="640" cy="15" r="1.2" fill="#e879f9"/>
    </g>
    <text x="600" y="58" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="3" fill="url(#txt)">GRACIAS POR PASAR POR AQUÍ ✦</text>
    <text x="600" y="84" text-anchor="middle" class="mono" font-size="13" fill="#c084fc">¿tienes un proyecto en mente? construyámoslo juntos</text>
    <g class="b" opacity=".35"><path d="M0 130 C150 100 300 160 450 130 S750 100 900 130 S1200 160 1350 130 S1650 100 1800 130 V190 H0Z" fill="#6366f1"/></g>
    <g class="a" opacity=".55"><path d="M0 145 C150 120 300 170 450 145 S750 120 900 145 S1200 170 1350 145 S1650 120 1800 145 V190 H0Z" fill="url(#w1)"/></g>
    <g class="c" opacity=".9"><path d="M0 162 C150 145 300 180 450 162 S750 145 900 162 S1200 180 1350 162 S1650 145 1800 162 V190 H0Z" fill="#2a1259"/></g>
  </g>
</svg>
