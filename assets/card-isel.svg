<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-label="Proyecto: Portal ISEL de la Universidad Mesoamericana">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160d2c"/>
      <stop offset="1" stop-color="#07030f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset=".5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="360 .5 .5;0 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f3ff"/><stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <radialGradient id="orb" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".55"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect x="2" y="2" width="436" height="296" rx="18"/></clipPath>
    <style>
      text{font-family:'Segoe UI','Inter',Ubuntu,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
      .orb{animation:orb 10s ease-in-out infinite}
      @keyframes orb{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,50px)}}
      .sign{stroke-dasharray:170;animation:sign 4s ease-in-out infinite}
      @keyframes sign{0%{stroke-dashoffset:170}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:170}}
      .check{stroke-dasharray:30;animation:check 4s ease-in-out infinite}
      @keyframes check{0%,45%{stroke-dashoffset:30}60%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:30}}
      .doc{animation:bob 5s ease-in-out infinite}
      @keyframes bob{0%,100%{transform:translateY(0) rotate(6deg)}50%{transform:translateY(-6px) rotate(4deg)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect x="2" y="2" width="436" height="296" rx="18" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <circle class="orb" cx="390" cy="50" r="120" fill="url(#orb)"/>
  </g>
  <!-- ficha que se firma sola -->
  <g transform="translate(332 22)">
    <g class="doc" style="transform-origin:40px 50px">
      <rect width="78" height="96" rx="8" fill="#f5f3ff" fill-opacity=".08" stroke="#a5b4fc" stroke-opacity=".7"/>
      <rect x="12" y="14" width="40" height="5" rx="2.5" fill="#a5b4fc" fill-opacity=".7"/>
      <rect x="12" y="26" width="54" height="4" rx="2" fill="#a5b4fc" fill-opacity=".35"/>
      <rect x="12" y="35" width="48" height="4" rx="2" fill="#a5b4fc" fill-opacity=".35"/>
      <rect x="12" y="44" width="52" height="4" rx="2" fill="#a5b4fc" fill-opacity=".35"/>
      <path class="sign" d="M12 76 C18 62 24 84 30 70 S40 64 44 74 S56 66 66 72" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
      <circle cx="66" cy="16" r="9" fill="#5ee4a8" fill-opacity=".2"/>
      <path class="check" d="M61 16 L65 20 L72 12" fill="none" stroke="#5ee4a8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <rect x="2" y="2" width="436" height="296" rx="18" fill="none" stroke="url(#edge)" stroke-width="2"/>

  <text x="26" y="40" class="mono" font-size="11" fill="#a5b4fc" letter-spacing="2">★ DESTACADO · 2026</text>
  <text x="26" y="74" font-size="25" font-weight="800" fill="url(#title)">Portal ISEL · UMES</text>
  <text x="26" y="96" font-size="13" fill="#b9a9e0">Instituto Salesiano de Educación en Línea</text>

  <text font-size="13.5" fill="#ece8ff">
    <tspan x="26" y="128">Trámites académicos 100 % digitales: asignación,</tspan>
    <tspan x="26" y="147">inscripción y título con firma digital, PDF oficial</tspan>
    <tspan x="26" y="166">automático y panel admin con pénsum editable.</tspan>
  </text>

  <g font-size="11" fill="#b9a9e0">
    <text x="26" y="206" font-size="20" font-weight="800" fill="#f5f3ff">170</text><text x="26" y="222">alumnos reales</text>
    <text x="126" y="206" font-size="20" font-weight="800" fill="#f5f3ff">3</text><text x="126" y="222">trámites digitales</text>
    <text x="242" y="206" font-size="20" font-weight="800" fill="#f5f3ff">12</text><text x="242" y="222">controladores REST</text>
  </g>

  <g class="mono" font-size="11">
    <rect x="26" y="248" width="104" height="24" rx="12" fill="#6366f1" fill-opacity=".18" stroke="#6366f1" stroke-opacity=".6"/><text x="78" y="264" text-anchor="middle" fill="#e0e7ff">ASP.NET Core 8</text>
    <rect x="138" y="248" width="60" height="24" rx="12" fill="#6366f1" fill-opacity=".18" stroke="#6366f1" stroke-opacity=".6"/><text x="168" y="264" text-anchor="middle" fill="#e0e7ff">React</text>
    <rect x="206" y="248" width="80" height="24" rx="12" fill="#6366f1" fill-opacity=".18" stroke="#6366f1" stroke-opacity=".6"/><text x="246" y="264" text-anchor="middle" fill="#e0e7ff">EF Core</text>
    <rect x="294" y="248" width="70" height="24" rx="12" fill="#6366f1" fill-opacity=".18" stroke="#6366f1" stroke-opacity=".6"/><text x="329" y="264" text-anchor="middle" fill="#e0e7ff">Tailwind</text>
    <rect x="372" y="248" width="44" height="24" rx="12" fill="#6366f1" fill-opacity=".18" stroke="#6366f1" stroke-opacity=".6"/><text x="394" y="264" text-anchor="middle" fill="#e0e7ff">C#</text>
  </g>
</svg>
