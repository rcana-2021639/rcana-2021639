<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Rhandy Caná — Full-Stack Developer &amp; UI/UX">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07030f"/>
      <stop offset=".62" stop-color="#120a24"/>
      <stop offset="1" stop-color="#1a0f33"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset=".25" stop-color="#c084fc"/>
      <stop offset=".5" stop-color="#ff5fe1"/>
      <stop offset=".75" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#f5f3ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset=".5" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="planet" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset=".35" stop-color="#a855f7"/>
      <stop offset=".75" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#1e0b3b"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b026ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#b026ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e879f9" stop-opacity=".95"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect x="0" y="300" width="1200" height="140" fill="url(#fade)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="440" rx="22"/></clipPath>
    <style>
      .tw{animation:tw 3s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
      .d1{animation-delay:-.4s}.d2{animation-delay:-1.1s}.d3{animation-delay:-1.8s}.d4{animation-delay:-2.5s}
      .grid-h{animation:run 1.6s linear infinite}
      @keyframes run{from{transform:translateY(0)}to{transform:translateY(28px)}}
      .float{animation:float 7s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      .pulse{animation:pulse 1.8s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
      .ping{animation:ping 1.8s ease-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes ping{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
      .in{animation:in 1s cubic-bezier(.2,.8,.2,1) both}
      .in1{animation-delay:.1s}.in2{animation-delay:.45s}.in3{animation-delay:.8s}.in4{animation-delay:1.1s}
      @keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
      .role{opacity:0;animation:role 12s infinite}.r1{opacity:1}
      .r2{animation-delay:4s}.r3{animation-delay:8s}
      @keyframes role{0%{opacity:0;transform:translateY(10px)}4%,29%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-10px)}}
      .caret{animation:caret 1s steps(1) infinite}
      @keyframes caret{50%{opacity:0}}
      .shoot{animation:shoot 7s linear infinite}
      @keyframes shoot{0%{transform:translate(0,0);opacity:0}2%{opacity:1}12%{transform:translate(-420px,210px);opacity:0}100%{opacity:0;transform:translate(-420px,210px)}}
      text{font-family:'Segoe UI','Inter',Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="url(#bg)"/>

    <!-- auroras -->
    <g filter="url(#blur)" opacity=".75">
      <ellipse cx="260" cy="120" rx="260" ry="110" fill="#7c3aed">
        <animate attributeName="cx" values="220;420;220" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="110;170;110" dur="11s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="820" cy="90" rx="240" ry="100" fill="#d946ef" opacity=".7">
        <animate attributeName="cx" values="860;660;860" dur="18s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="560" cy="300" rx="300" ry="90" fill="#6366f1" opacity=".55">
        <animate attributeName="rx" values="300;380;300" dur="13s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- estrellas -->
    <g fill="#f5f3ff">
      <circle class="tw" cx="60" cy="40" r="1.4"/><circle class="tw d1" cx="140" cy="210" r="1"/>
      <circle class="tw d2" cx="230" cy="70" r="1.6"/><circle class="tw d3" cx="330" cy="30" r="1"/>
      <circle class="tw d4" cx="420" cy="250" r="1.2"/><circle class="tw d1" cx="505" cy="55" r="1.8"/>
      <circle class="tw d2" cx="610" cy="20" r="1"/><circle class="tw" cx="690" cy="120" r="1.3"/>
      <circle class="tw d3" cx="760" cy="40" r="1"/><circle class="tw d4" cx="1130" cy="60" r="1.6"/>
      <circle class="tw d1" cx="1160" cy="250" r="1"/><circle class="tw d2" cx="1060" cy="25" r="1.1"/>
      <circle class="tw d3" cx="30" cy="270" r="1.2"/><circle class="tw d4" cx="580" cy="190" r="1"/>
      <circle class="tw" cx="1185" cy="150" r="1.4"/><circle class="tw d2" cx="380" cy="150" r="1"/>
      <circle class="tw d1" cx="95" cy="120" r="1.8" fill="#e879f9"/><circle class="tw d3" cx="725" cy="235" r="1.6" fill="#c084fc"/>
      <circle class="tw d4" cx="470" cy="12" r="1.5" fill="#22d3ee"/><circle class="tw" cx="1100" cy="290" r="1.3" fill="#e879f9"/>
    </g>

    <!-- estrella fugaz -->
    <g class="shoot">
      <line x1="1150" y1="20" x2="1230" y2="-20" stroke="url(#ring)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="1150" cy="20" r="2.2" fill="#fff"/>
    </g>

    <!-- piso synthwave -->
    <g mask="url(#gridMask)" stroke="#a855f7" stroke-opacity=".55" stroke-width="1" fill="none">
      <g class="grid-h">
        <line x1="0" y1="276" x2="1200" y2="276"/><line x1="0" y1="304" x2="1200" y2="304"/>
        <line x1="0" y1="332" x2="1200" y2="332"/><line x1="0" y1="360" x2="1200" y2="360"/>
        <line x1="0" y1="388" x2="1200" y2="388"/><line x1="0" y1="416" x2="1200" y2="416"/>
        <line x1="0" y1="444" x2="1200" y2="444"/>
      </g>
      <path d="M600 300 L-600 440 M600 300 L-300 440 M600 300 L0 440 M600 300 L200 440 M600 300 L400 440 M600 300 L600 440 M600 300 L800 440 M600 300 L1000 440 M600 300 L1200 440 M600 300 L1500 440 M600 300 L1800 440"/>
    </g>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="url(#brand)" stroke-width="1.5" opacity=".8"/>

    <!-- planeta -->
    <g class="float">
      <circle cx="975" cy="165" r="150" fill="url(#glow)"/>
      <!-- mitad trasera de los anillos -->
      <g transform="rotate(-16 975 165)" fill="none">
        <path d="M825 165 A150 30 0 0 1 1125 165" stroke="url(#ring)" stroke-width="3" opacity=".55"/>
        <path d="M850 165 A125 22 0 0 1 1100 165" stroke="#c084fc" stroke-opacity=".3" stroke-width="1.5" stroke-dasharray="4 8"/>
      </g>
      <clipPath id="ball"><circle cx="975" cy="165" r="82"/></clipPath>
      <circle cx="975" cy="165" r="82" fill="url(#planet)"/>
      <g clip-path="url(#ball)" fill="none" stroke-linecap="round">
        <path d="M880 128 Q975 104 1070 132" stroke="#f5d0fe" stroke-opacity=".22" stroke-width="8">
          <animate attributeName="d" values="M880 128 Q975 104 1070 132;M880 132 Q975 112 1070 128;M880 128 Q975 104 1070 132" dur="9s" repeatCount="indefinite"/>
        </path>
        <path d="M880 175 Q975 160 1070 185" stroke="#2e1065" stroke-opacity=".35" stroke-width="11"/>
        <path d="M880 210 Q975 198 1070 222" stroke="#f0abfc" stroke-opacity=".15" stroke-width="6"/>
      </g>
      <!-- mitad delantera -->
      <g transform="rotate(-16 975 165)" fill="none">
        <path d="M825 165 A150 30 0 0 0 1125 165" stroke="url(#ring)" stroke-width="3.5"/>
        <path d="M850 165 A125 22 0 0 0 1100 165" stroke="#c084fc" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="4 8">
          <animate attributeName="stroke-dashoffset" values="0;-120" dur="6s" repeatCount="indefinite"/>
        </path>
      </g>
      <!-- luna orbitando -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 975 165" to="360 975 165" dur="14s" repeatCount="indefinite"/>
        <circle cx="975" cy="45" r="7" fill="#22d3ee" filter="url(#neon)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360 975 165" to="0 975 165" dur="22s" repeatCount="indefinite"/>
        <circle cx="1135" cy="165" r="4" fill="#ff5fe1"/>
      </g>
    </g>

    <!-- estado -->
    <g class="in in1"><g transform="translate(70 70)">
      <rect width="318" height="34" rx="17" fill="#1c1038" fill-opacity=".85" stroke="#a855f7" stroke-opacity=".45"/>
      <circle class="ping" cx="22" cy="17" r="5" fill="#5ee4a8"/>
      <circle class="pulse" cx="22" cy="17" r="5" fill="#5ee4a8"/>
      <text x="38" y="22" font-size="13" font-weight="600" fill="#ece8ff" letter-spacing="1.6">DISPONIBLE · FREELANCE &amp; REMOTO</text>
    </g></g>

    <!-- nombre -->
    <g class="in in2">
      <text x="68" y="168" font-size="70" font-weight="800" fill="url(#name)" letter-spacing="1" filter="url(#neon)">RHANDY CANÁ</text>
    </g>
    <g class="in in3">
      <text x="72" y="210" font-size="24" font-weight="600" fill="#d8b4fe" letter-spacing="3">FULL-STACK DEVELOPER  ✦  UI / UX</text>
    </g>

    <!-- roles rotando -->
    <g class="in in4">
      <text x="72" y="256" class="mono caret" font-size="19" fill="#22d3ee">&gt;</text>
      <g class="mono" font-size="19" fill="#ece8ff">
        <text class="role r1" x="96" y="256">construyo plataformas web para universidades</text>
        <text class="role r2" x="96" y="256">React · Next.js · Node.js · .NET · PostgreSQL</text>
        <text class="role r3" x="96" y="256">diseño interfaces que se sienten de otro mundo</text>
      </g>
    </g>

    <text x="1130" y="420" text-anchor="end" class="mono" font-size="13" fill="#b9a9e0" opacity=".8">Guatemala · GT</text>
    <rect x="1" y="1" width="1198" height="438" rx="21" fill="none" stroke="#c084fc" stroke-opacity=".35"/>
  </g>
</svg>
