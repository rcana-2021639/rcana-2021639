<svg xmlns="http://www.w3.org/2000/svg" width="900" height="70" viewBox="0 0 900 70" role="img" aria-label="Sobre Mí">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/><stop offset=".5" stop-color="#ff5fe1"/><stop offset="1" stop-color="#6366f1"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-.5 0;.5 0;-.5 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0"/><stop offset=".5" stop-color="#e879f9"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:'Segoe UI','Inter',Ubuntu,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
      .sweep{animation:sweep 3.5s cubic-bezier(.6,0,.2,1) infinite}
      @keyframes sweep{0%{transform:translateX(-320px)}100%{transform:translateX(900px)}}
      .spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
      @keyframes spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
    <clipPath id="c"><rect x="0" y="56" width="900" height="4"/></clipPath>
  </defs>
  <g transform="translate(450 30)">
    <g class="spin"><path d="M-0 -11 L3 -3 L11 0 L3 3 L0 11 L-3 3 L-11 0 L-3 -3Z" fill="#e879f9" transform="translate(-146.0 0)"/></g>
  </g>
  <text x="450" y="40" text-anchor="middle" font-size="27" font-weight="800" letter-spacing="5" fill="url(#g)" filter="url(#glow)">SOBRE MÍ</text>
  <text x="278.0" y="38" text-anchor="end" class="mono" font-size="13" fill="#8b7bb5">01 /</text>
  <rect x="150" y="57" width="600" height="1.5" fill="#a855f7" fill-opacity=".25"/>
  <g clip-path="url(#c)"><rect class="sweep" x="0" y="56" width="300" height="3" fill="url(#line)"/></g>
</svg>
